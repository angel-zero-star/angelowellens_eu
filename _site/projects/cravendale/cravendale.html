<STYLE type="text/css">


#wrap_project img {	
	display: inline;
	position: relative;
	margin-top: 5%;
	float: left;
	vertical-align: top;
	}
	

video {
	margin-top: 5%;
	display: block;
	float: left;
}	


.lazy {
    opacity: 1;
      -webkit-transition: opacity 0.5s;
    -moz-transition: opacity 0.5s;
    -ms-transition: opacity 0.5s;
    -o-transition: opacity 0.5s;
    transition: opacity 0.2s;
 
}


#wrap_project {
	margin-left: auto;
	margin-right: auto;	
	width: 84%;
	max-width: 1400px;
	left: 0;
	right: 0;
	opacity: 0;
	-webkit-transform: translate3d(0,100px,0);
			transform: translate3d(0,100px,0);
	-webkit-transition: all 0.85s ease-out;
			transition: all 0.85s ease-out;	
}

.project-alt {
	opacity: 1 !important;
	-webkit-transform: translate3d(0,0,0) !important;
			transform: translate3d(0,0,0) !important;
}

h4 {
	font-family: 'Source Sans Pro', sans-serif;
	margin-top: 20%;
	color: #3c3c3c;
	font-size: 640%;
	text-align: center;
	font-style: normal;
	font-weight: 400;
	line-height: 100%;
}
.center{
	width: 100%;
	float: left;
}

iframe {
	width: 100%;
	left: 0;
	right: 0;	
	
	margin-left: 0%;
	margin-right: 0%;
	       	-webkit-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   -moz-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   		box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
}
p {
	font-family: 'Source Sans Pro', sans-serif;
	margin-bottom: 5%;
	font-size: 20px;
	text-align: center;
	font-style: normal;
	font-weight: 400;
	line-height: 30px;
}



</STYLE>
