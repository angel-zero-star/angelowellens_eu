function filter(check,category,category2,category3) {
	//add and remove categories
	var $items = $('.'+category);
	var $items2 = $('.'+category2);
	var $items3 = $('.'+category3);
	
	if ($(check).is(':checked')) {
		//getposts(category);
		
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).fadeOut('fast', function() { 
 			$($items).addClass('showhide');
 			$('#'+category).addClass('non_active');
/*  			$('#container').masonry( 'reload'); */
   		 	 });
   		 	 
   		 $($items2).fadeOut('fast', function() { 
 			$($items2).addClass('showhide');
 			$('#'+category2).addClass('non_active');
 			$('#container').masonry( 'reload');
   		 	 });
   		 	 
   		 	 $($items3).removeClass('showhide');
   		 	 $('#'+category3).removeClass('non_active');
   		 	 $('#container').masonry( 'reload', function() {	
   		 	 $($items3).fadeIn('fast', function() {
	   		 	 $('#container').masonry( 'reload');
   		 	 });
   		 	 });
	}
	else {
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).removeClass('showhide');
		$($items2).removeClass('showhide');
		$('#'+category).removeClass('non_active');
		$('#'+category2).removeClass('non_active');
 		$('#container').masonry( 'reload', function() {
 			 $($items).fadeIn('fast', function() {});
 			 $($items2).fadeIn('fast', function() {});
 		});
		 
		}
    }

	


</script>

		$(window).load(function() { // makes sure the whole site is loaded

			enableScroll();

			 $( "#loader" ).delay(1500).fadeOut( 1000, function() {
			 	$("body").removeClass("noscroll");
			 	$("#zwart").delay(0).fadeOut();

			 	// Lay the grid out instantly, then let each card fall into place
			 	// from above — fading in, cascading left-to-right, top-to-bottom.
			 	var $items = $('#container .item');
			 	$('#container').masonry({ columnWidth: 230, isFitWidth: true, isAnimated: false });
			 	$items.css({ opacity: 0, transform: 'translateY(-120px)' });

			 	$('#m').fadeIn(1000);
			 	setTimeout(function() {
			 		var cw = $('#container').width() || 1;
			 		var ch = $('#container').height() || 1;
			 		$items.each(function() {
			 			var pos = $(this).position();
			 			var delay = Math.round((pos.left / cw) * 350 + (pos.top / ch) * 550);
			 			$(this).css('transition',
			 				'transform 0.8s cubic-bezier(0.22, 1, 0.36, 1) ' + delay + 'ms, ' +
			 				'opacity 0.6s ease ' + delay + 'ms');
			 		});
			 		requestAnimationFrame(function() {
			 			$items.css({ opacity: 1, transform: 'none' });
			 		});
			 		// drop the per-card transitions once the cascade is done,
			 		// so masonry's own resize animation is unaffected
			 		setTimeout(function() { $items.css('transition', ''); }, 2200);
			 	}, 150);
