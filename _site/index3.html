function filter(check,category,category2,category3) {
	//add and remove categories
	var $items = $('.'+category);
	var $items2 = $('.'+category2);
	var $items3 = $('.'+category3);
	
	if ($(check).is(':checked')) {
		//getposts(category);
		
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).fadeOut('fast', function() {

/*  			$('#container').masonry( 'reload'); */

 			$($items2).addClass('showhide');

   		 	 });
   		 	 
   		 	 $($items3).removeClass('showhide');
   		 	 $('#'+category3).removeClass('non_active');
   		 	 $('#container').masonry( 'reload', function() {	
   		 	 $($items3).fadeIn('fast', function() {
	   		 	 $('#container').masonry( 'reload');
   		 	 });
   		 	 });
	}
	else {
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).removeClass('showhide');
		$($items2).removeClass('showhide');
		$('#'+category).removeClass('non_active');
		$('#'+category2).removeClass('non_active');
 		$('#container').masonry( 'reload', function() {
 			 $($items).fadeIn('fast', function() {});
 			 $($items2).fadeIn('fast', function() {});
 		});
		 
		}
    }
