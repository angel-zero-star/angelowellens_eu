function filter(check,category,category2,category3) {
	//add and remove categories
	var $items = $('.'+category);
	var $items2 = $('.'+category2);
	var $items3 = $('.'+category3);
	
	if ($(check).is(':checked')) {
		//getposts(category);
		
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).fadeOut('fast', function() { 
 			$($items).addClass('showhide');
 			$('#'+category).addClass('non_active');
/*  			$('#container').masonry( 'reload'); */
   		 	 });
   		 	 
   		 $($items2).fadeOut('fast', function() { 
 			$($items2).addClass('showhide');
 			$('#'+category2).addClass('non_active');
 			$('#container').masonry( 'reload');
   		 	 });
   		 	 
   		 	 $($items3).removeClass('showhide');
   		 	 $('#'+category3).removeClass('non_active');
   		 	 $('#container').masonry( 'reload', function() {	
   		 	 $($items3).fadeIn('fast', function() {
	   		 	 $('#container').masonry( 'reload');
   		 	 });
   		 	 });
	}
	else {
		$('#check'+category).prop("checked", false);
		$('#check'+category2).prop("checked", false);
		$($items).removeClass('showhide');
		$($items2).removeClass('showhide');
		$('#'+category).removeClass('non_active');
		$('#'+category2).removeClass('non_active');
 		$('#container').masonry( 'reload', function() {
 			 $($items).fadeIn('fast', function() {});
 			 $($items2).fadeIn('fast', function() {});
 		});
		 
		}
    }

	


</script>

			 	// only the active scope's grids get revealed — the hidden scope's
			 	// section is display:none, so its grid measures zero and is
			 	// relaid out by setScope() if it's ever switched to
			 	var $grids = $('.work-section').not('.section-hidden').find('.work-grid');
			 	var $items = $grids.find('.item').not('.showhide');
			 	$('.work-grid').masonry({ columnWidth: 230, isFitWidth: true, isAnimated: false });
			 	$items.css({ opacity: 0 });

			 	$('#m').fadeIn(1000);
			 	setTimeout(function() {
			 		// offset each section so they cascade in order, not together
			 		$grids.each(function(gi) {
			 			var $g = $(this);
			 			runCascade($g.find('.item').not('.showhide'), $g, gi * 180);
			 		});
			 		// hand animation back to masonry so columns slide on window
			 		// resize (the layout above ran with isAnimated:false so the
			 		// cards snapped straight to their start positions)
			 		setTimeout(function() {
			 			$('.work-grid').masonry('option', {
