<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/> 
<title>Asian Cup 2015</title>
<link rel="stylesheet" href="css/style.css?v=2" type="text/css" media="screen" />
<link href="css/twentytwenty-no-compass.css?v=2" rel="stylesheet" type="text/css" />

<STYLE type="text/css">


#wrap_project img {	
	display: inline;
	position: relative;
	margin-top: 5%;
	float: left;
	vertical-align: top;
	}
	

video {
	margin-top: 5%;
	display: block;
	float: left;
}	


.lazy {
    opacity: 1;
      -webkit-transition: opacity 0.5s;
    -moz-transition: opacity 0.5s;
    -ms-transition: opacity 0.5s;
    -o-transition: opacity 0.5s;
    transition: opacity 0.2s;
       	-webkit-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   -moz-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   		box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
}


#wrap_project {
	margin-left: 8%;
	margin-right: 8%;	
	width: 84%;
	max-width: 1280px;
	left: 0;
	right: 0;
	-webkit-transform: translate3d(0,100px,0);
			transform: translate3d(0,100px,0);
	-webkit-transition: all 0.85s ease-out;
			transition: all 0.85s ease-out;	
}

.project-alt {
	opacity: 1 !important;
	-webkit-transform: translate3d(0,0,0) !important;
			transform: translate3d(0,0,0) !important;
}

h4 {
	font-family: 'Source Sans Pro', sans-serif;
	margin-top: 20%;
	color: #3c3c3c;
	font-size: 640%;
	text-align: center;
	font-style: normal;
	font-weight: 400;
	line-height: 100%;
}
.center{
	width: 100%;
	float: left;
}

iframe {
	width: 100%;
	left: 0;
	right: 0;	
	
	margin-left: 0%;
	margin-right: 0%;
	       	-webkit-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   -moz-box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
	   		box-shadow: 0px 0px 32px -1px rgba(0,0,0,0.2);
}



</STYLE>


</head>
<body> 
	<div class="twentytwenty-container">
				<img src="projects/AsianCup/assets/1.jpg" width="100%" height="auto" />
				<img src="projects/AsianCup/assets/2.jpg" width="100%" height="auto" />
			</div>	<!-- slider -->	
	
		<div class="center"><h4>Asian Cup 2015</h4></div> 
					
		<img id="loader2" src="loading_good.gif" width="auto" height="auto">
		<div id="wrap_project">
	
			<img class="lazy" src="projects/AsianCup/assets/1_stage.jpg" width="100%" height="auto">
			<img class="lazy" src="projects/AsianCup/assets/approximate_measurements.jpg" width="100%" height="auto">
			<img class="lazy" src="projects/AsianCup/assets/movement.jpg" width="100%" height="auto">
			<img class="lazy" src="projects/AsianCup/assets/3.jpg" width="100%" height="auto">
			
				
			
		<div style="height100px;">&nbsp;<br />&nbsp;<br />&nbsp;</div>	



		  </div> <!-- project -->
<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.8.1/jquery.js"></script>
